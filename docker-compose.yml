version: "3.9"
services:
  backend:
    build: ./back
    ports:
      - "8000:8000"
    volumes:
      - ./back/app:/app/app

  frontend:
    build: ./front
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./front:/app
